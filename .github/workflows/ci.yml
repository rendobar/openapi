name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public-surface deny-list
        run: python3 -I scripts/deny_list.py
      - name: The mock serves the spec
        run: |
          python3 -I conformance/mock_server.py openapi.json 4100 requests.jsonl &
          for i in $(seq 1 20); do curl -sf -X POST http://127.0.0.1:4100/__reset && break; sleep 0.5; done
          curl -sf http://127.0.0.1:4100/jobs/types > /dev/null
          curl -sf -H "Authorization: Bearer k" http://127.0.0.1:4100/jobs/job_done > /dev/null
          curl -sf -H "Authorization: Bearer k" http://127.0.0.1:4100/jobs/job_cancelled > /dev/null
          curl -sf http://127.0.0.1:4100/__requests | python3 -c "import json,sys;assert [r['path'] for r in json.load(sys.stdin)['data']]==['/jobs/types','/jobs/job_done','/jobs/job_cancelled']"
          python3 -c "import json;json.load(open('conformance/webhook-vectors.json'))"
